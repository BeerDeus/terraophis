<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin | Terraophis</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
</head>
<body class="beige-theme login-page">

    <div class="login-container">
        <img src="assets/img/logo_rect.png" alt="Terraophis" class="login-logo">
        
        <form id="loginForm" class="login-card">
            <h2>Administration</h2>
            <p>Veuillez vous identifier pour gérer la boutique.</p>
            
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Mot de passe" required>
            
            <button type="submit" class="btn-buy">SE CONNECTER</button>
            <p id="authError" class="error-msg"></p>
        </form>
        
        <a href="index.html" class="back-link">← Retour au site</a>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
