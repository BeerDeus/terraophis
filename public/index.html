<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terraophis | Boutique d'insectes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
</head>
<body class="beige-theme">

    <nav class="navbar" id="main-navbar">
    </nav>

    <header class="hero-slider">
        <div class="slide active" style="background-image: url('assets/img/hero-sunset.jpg');">
            <div class="slide-content">
                <div class="arrows">
                    <span class="prev">‹</span>
                    <span class="next">›</span>
                </div>
                <div class="dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="features-grid">
            <div class="feature-card" id="boutique-feature">
                <img src="assets/img/placeholder.jpg" alt="">
                <img src="assets/img/placeholder.jpg" alt="">
                <img src="assets/img/placeholder.jpg" alt="">
                <img src="assets/img/placeholder.jpg" alt="">
                <div class="feature-overlay">
                    <h2>Boutique Animalerie</h2>
                </div>
                    <a href="boutique" class="btn-explorer">Explorer</a>
            </div>
            <div class="feature-card" id="conseil-feature">
                <img src="assets/img/placeholder.jpg" alt="">
                <img src="assets/img/placeholder.jpg" alt="">
                <img src="assets/img/placeholder.jpg" alt="">
                <img src="assets/img/placeholder.jpg" alt="">
                <div class="feature-overlay">
                    <h2>Conseil et Guide</h2>
                </div>
                    <a href="#conseils" class="btn-explorer">Explorer</a>
            </div>
        </section>

        <section class="instagram-section">
            <div class="insta-header">
                <h2>Galerie Instagram</h2>
                <a href="https://www.instagram.com/terra.ophis" target="_blank" class="insta-handle">@TERRAOPHIS</a>
            </div>
            
            <behold-widget feed-id="bQNZ6B9W6XDxHhcLbFA7"></behold-widget>
        </section>
    </main>
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>Votre Panier</h2>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cartItemsContainer">
            </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total (hors frais de port)</span>
                <span id="cartTotalAmount">0.00 €</span>
            </div>
            <button class="btn-checkout" id="btnCheckout" onclick="processCheckout()">VALIDER LA COMMANDE</button>
        </div>
    </div>
    <footer id="main-footer"></footer>

    <script>
      (() => {
        const d=document,s=d.createElement("script");s.type="module";
        s.src="https://w.behold.so/widget.js";d.head.append(s);
      })();
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
